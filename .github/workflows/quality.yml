name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: type-check + lint + format + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Nested layout, matching the integration job: the ingest suites copy the
      # real index generator out of a sibling brain checkout, and a clips-only
      # clone skips them - nine suites' worth, which is below the coverage
      # thresholds this job enforces.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: clips
          persist-credentials: false

      - name: Read the pinned engine commit
        id: engine
        run: echo "ref=$(cat clips/.brain-engine-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: syntopica/brain
          ref: ${{ steps.engine.outputs.ref }}
          path: brain
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clips/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clips/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - run: pnpm --dir clips install --frozen-lockfile

      - name: Install the brain engine the fixtures run
        run: uv sync --project brain --locked --all-extras --all-groups

      - name: check:ci
        run: pnpm --dir clips run check:ci

  gate:
    name: python gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The Python suite drives the launcher, which is Node.
      - run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install from the lockfile
        run: uv sync --locked --all-extras --all-groups
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run the quality gate
        run: uv run codeality-py gate --json

  integration:
    name: against a pinned brain engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: clips
          persist-credentials: false

      # An explicit commit, not a branch: an engine that moves under CI turns a
      # green run into a claim about whatever main happened to be.
      - name: Read the pinned engine commit
        id: engine
        run: echo "ref=$(cat clips/.brain-engine-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: syntopica/brain
          ref: ${{ steps.engine.outputs.ref }}
          path: brain
          persist-credentials: false

      # This job checks the engine out under clips/, so the version has to be
      # read from that package.json rather than from the workspace root.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clips/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clips/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install both engines
        run: |
          pnpm --dir clips install --frozen-lockfile
          uv sync --project clips --locked --all-extras --all-groups
          uv sync --project brain --locked --all-extras --all-groups

      # The instance is built here and its origins are bare repositories in the
      # runner's own temporary directory: no real remote, and no credential
      # that could reach the owner's data directory or clip archive.
      - name: Run both suites against a synthetic instance
        run: |
          # --directory as well as --project: pytest resolves `tests.` against
          # its working directory, and from the workspace root every module in
          # clips/tests failed to import.
          uv run --directory clips pytest -q
          pnpm --dir clips test

  security:
    name: secrets + advisories + workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: gitleaks cannot see a secret committed three commits ago
      # from a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --no-banner --redact

      - name: Workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
