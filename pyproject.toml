  "convert_antigravity",
  "convert_claude_hosts",
  "convert_claude_jsonl",
  "convert_codex",
  "count_words",
  "default_capture_archive",
  "drops_from",
  "duplicate_capture",
  "extension_for",
  "extract",
  "frontmatter_block",
  "frontmatter_fields",
  "gone_urls",
  "https_only_redirect_handler",
  "import_triage",
  "index_capture",
  "is_medium",
  "is_noise",
  "is_shown",
  "iter_jsonl",
  "keep",
  "kept_from",
  "known_projects",
  "largest_srcset_candidate",
