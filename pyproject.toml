[project]
name = "syntopica-clips"
version = "0.1.0"
description = "The capture and ingest engine's Python adapters: capture archive, sessions and review passes"
requires-python = ">=3.12"
dependencies = [

]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The tools are scripts, not an installable package: nothing here is imported
# by name from outside, so there is nothing to build a wheel from.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.deptry]
# Sibling modules the tools import by bare name, the way a script run from its
# own directory sees them. Generated from this tree by
# `tools/migration/first_party_modules.py`; a list inherited from elsewhere
# names files that are not here, and a rule that can never fire reads as a rule
# that passes.
known_first_party = [
  "all_runs",
  "already_checked",
  "already_screened",
  "annotate",
  "asset_urls",
  "audit_lines",
  "backfill_clip",
  "batch_prompt",
  "bucket_for",
  "build_frontmatter",
  "build_metadata",
  "build_prompt",
  "call",
  "candidate",
  "candidates",
  "capture_article",
  "capture_backfill_assets_fetch",
  "capture_page_transport_fetch",
  "capture_screen_pending_clip_body",
  "capture_screen_pending_run_agy",
  "capture_url_index_normalize",
  "captured",
  "chatgpt_convert_message_text",
  "chatgpt_convert_render",
  "chatgpt_convert_slug",
  "chatgpt_mine_run_agy",
  "chatgpt_mine_unwrap_agy_response",
  "chatgpt_mine_validate_items",
  "chatgpt_output_directory",
  "chatgpt_triage_run_agy",
  "chatgpt_triage_unwrap_agy_response",
  "chatgpt_triage_validate_items",
  "check",
  "clip_dirs",
  "clip_id",
  "clip_result",
  "clipped_at",
