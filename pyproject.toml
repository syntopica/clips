[tool.deptry.per_rule_ignores]
DEP004 = ["pytest", "pytest_asyncio", "pytest_cov"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 19

[dependency-groups]
quality = [
  "busirocket-baseline-py>=0.1,<1",
  "deptry>=0.20,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.15,<1",
]

# `uv sync` installs the `dev` group and no other, so a group named anything
# else is a group a fresh clone does not get. Measured on the published tree:
# `uv sync` reported "Installed 1 package" and both `pytest` and `baseline-py`
# were then missing, which makes the one command the README gives a stranger
# the command that cannot work.
[tool.uv]
default-groups = ["quality"]
